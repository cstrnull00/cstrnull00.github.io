name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # Hextra 테마(서브모듈)를 가져오기 위해 필수
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # 'latest'는 Hugo가 올라갈 때마다 빌드가 조용히 깨질 수 있어 고정.
          # 0.154.5는 로컬에서 빌드 검증된 버전.
          # 0.165.0에서는 빌드가 실패하며 원인 미규명 상태이므로,
          # 올릴 때는 반드시 로컬에서 같은 버전으로 빌드해보고 변경할 것.
          hugo-version: '0.154.5'
          extended: true # Hextra는 반드시 extended 버전 필요

      - name: Build with Hugo
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4