name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # 매주 월요일 03:00 KST (일요일 18:00 UTC) — 플레이 기록 갱신용
    - cron: "0 18 * * 0"

permissions:
  # 동기화한 데이터를 레포에 커밋한다. 그래야 API 가 실패해도 페이지가
  # "지난주 실제 데이터 + 진짜 갱신 날짜"로 남는다 (예시 데이터로 되돌아가지 않음).
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 스텝의 if 에서는 secrets 컨텍스트를 쓸 수 없어 여기서 넘긴다.
      # (runner 컨텍스트는 잡 레벨 env 에서 쓸 수 없으므로 경로는 스텝에서 만든다)
      HAS_PSN_ROTATION: ${{ secrets.GH_SECRETS_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # Stack 테마(서브모듈)를 가져오기 위해 필수
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # 'latest'는 Hugo가 올라갈 때마다 빌드가 조용히 깨질 수 있어 고정.
          # Stack 4.0.3 은 Hugo 0.157 이상을 요구한다.
          # 올릴 때는 로컬에서 같은 버전으로 빌드해보고 변경할 것.
          hugo-version: '0.165.0'
          extended: true # Stack 도 extended 필요 (SCSS 트랜스파일)

      # 플레이 기록을 새로 받아 온다. 실패해도 빌드는 계속한다 —
      # 그 경우 레포에 커밋된 data/played/steam.json 으로 빌드된다.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Sync Steam library
        continue-on-error: true
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: node scripts/sync-steam.mjs

      # PSN 은 비공식 API 라 언제든 막힐 수 있다. 실패해도 빌드는 계속되고
      # 그 경우 커밋된 psn.json(지난 데이터)으로 렌더된다.
      - name: Sync PlayStation library
        id: psn
        continue-on-error: true
        env:
          PSN_REFRESH_TOKEN: ${{ secrets.PSN_REFRESH_TOKEN }}
          PSN_TOKEN_OUT: ${{ runner.temp }}/psn_refresh_token
        run: node scripts/sync-psn.mjs

      # 리프레시 토큰은 교환할 때마다 새로 발급된다(약 60일 유효).
      # 새 토큰을 시크릿에 다시 저장하지 않으면 60일 뒤 체인이 끊기고
      # NPSSO 재발급이 필요해진다. 이 스텝이 그 저장을 담당한다.
      - name: Rotate PSN refresh token
        if: steps.psn.outcome == 'success' && env.HAS_PSN_ROTATION == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          f="${{ runner.temp }}/psn_refresh_token"
          if [ -s "$f" ]; then
            gh secret set PSN_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$f"
            echo "PSN 리프레시 토큰을 갱신했습니다."
          else
            echo "새 토큰 파일이 비어 있습니다 — 갱신 건너뜀." >&2
          fi

      # 받아온 데이터를 커밋해 다음 실패 때의 폴백으로 남긴다.
      # GITHUB_TOKEN 으로 푸시하면 워크플로가 재실행되지 않으므로 루프는 없다.
      - name: Commit synced data
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- data/played; then
            echo "데이터 변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/played
          git commit -m "Chore: Update played data [skip ci]"
          git push

      - name: Build with Hugo
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4