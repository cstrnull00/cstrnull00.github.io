baseURL:  https://cstrnull00.github.io/
title:  기타 의견 반려함
theme:  hextra
contentDir: "content"
timeZone: "Asia/Seoul"

# 테마 UI 문구를 한국어로 (themes/hextra/i18n/ko.yaml 사용)
languageCode: "ko-KR"
defaultContentLanguage: "ko"

# json은 Hextra 검색 인덱스 전용. enableSearch가 false라 미사용 +
# home 레이아웃에 json 템플릿이 없어 빌드 경고를 유발하므로 제외.
# 검색을 켤 경우 json을 다시 추가할 것.
outputs:
  home: [html, rss]

params:
  enableSearch: false
  # 각 글 하단에 최종 수정일 표시 (enableGitInfo 기반)
  displayUpdatedDate: true
  dateFormat: "2006-01-02"
  navbar:
    logo:
      path: images/logo.png
      width: 32
      height: 32

menus:
  main:
    - name: "게임 리뷰"
      url: "/review/"
      weight: 2
    - name: "콘텐츠 분석"
      url: "/analysis/"
      weight: 3

markup:
  goldmark:
    renderer:
      unsafe: true

enableGitInfo: true

ignoreFiles:
  - ".*glossary.*"