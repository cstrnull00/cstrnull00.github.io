name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # 매주 월요일 03:00 KST (일요일 18:00 UTC) — 플레이 기록 갱신용
    - cron: "0 18 * * 0"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # Stack 테마(서브모듈)를 가져오기 위해 필수
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # 'latest'는 Hugo가 올라갈 때마다 빌드가 조용히 깨질 수 있어 고정.
          # Stack 4.0.3 은 Hugo 0.157 이상을 요구한다.
          # 올릴 때는 로컬에서 같은 버전으로 빌드해보고 변경할 것.
          hugo-version: '0.165.0'
          extended: true # Stack 도 extended 필요 (SCSS 트랜스파일)

      # 플레이 기록을 새로 받아 온다. 실패해도 빌드는 계속한다 —
      # 그 경우 레포에 커밋된 data/played/steam.json 으로 빌드된다.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync Steam library
        continue-on-error: true
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: node scripts/sync-steam.mjs

      - name: Build with Hugo
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4