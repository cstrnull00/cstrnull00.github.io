# 플레이한 게임 목록의 한글 검색어 (layouts/_shortcodes/played.html)
#
# 스팀은 게임 이름을 영어로만 주고, PS 도 일부만 한국어다. 그래서 "위쳐"나 "문명"으로는
# 찾을 수 없었다. 여기 적은 이름은 화면에 보이지 않고 검색에만 쓰인다.
# 공식 한국어 제목이 있으면 그것을, 흔히 부르는 줄임말이 있으면 함께 적는다.
#
# 키: 스팀은 appid, PS 는 titleId 를 소문자로 적는다 (Hugo 가 데이터 키를 소문자로 읽는다).
# 동기화 스크립트(scripts/sync-*.mjs)는 이 파일을 건드리지 않는다.
# 새 게임이 목록에 생기면 여기에 한 줄 더한다. 빠져 있어도 영어 이름으로는 찾힌다.

