baseURL: https://cstrnull00.github.io/
title: 기타 의견 반려함
theme: stack

locale: "ko-kr"
defaultContentLanguage: "ko"
# CJK 언어일 때 .Summary / .WordCount 가 올바르게 동작하도록
hasCJKLanguage: true
timeZone: "Asia/Seoul"

enableGitInfo: true

# 최종 수정일은 프론트매터에 lastmod 를 직접 적은 글에만 표시한다.
# git 커밋 날짜를 쓰면 표기 정리 같은 일괄 작업마다 모든 글의 수정일이
# 바뀌어, 내용이 갱신된 것처럼 읽힌다. lastmod 가 없으면 게시일(date)로
# 채워지고, 두 값이 같으면 테마가 수정일 줄을 숨긴다.
frontmatter:
  lastmod: [lastmod, date]

# robots.txt 를 생성한다. 내용은 layouts/robots.txt 에서 정의하며,
# 사이트맵 위치를 명시해 크롤러가 유입 링크 없이도 전체 페이지를 찾게 한다.
enableRobotsTXT: true

# 기본값(categories, tags)에 게임 기본 정보를 더한다. 리뷰의 프론트매터에서
# 읽으며, 본문의 기본 정보 표도 같은 값으로 그린다 (layouts/_shortcodes/game-info.html).
taxonomies:
  category: categories
  tag: tags
  developer: developers
  publisher: publishers
  platform: platforms

ignoreFiles:
  - ".*glossary.*"

markup:
  goldmark:
    renderer:
      unsafe: true
    # 본문에서 <<작품명>> 으로 쓰면 《작품명》 으로 바뀐다.
    # ***작품명***와 처럼 강조 뒤에 조사가 붙으면 강조가 깨지는 문제를 피하려고 쓴다.
    extensions:
      # <|DLC 제목|>은 〈DLC 제목〉으로 표시한다. 일반 <...>는 건드리지 않는다.
      # 코드 안의 표기는 Markdown 파서가 그대로 보존한다.
      passthrough:
        enable: true
        delimiters:
          block: []
          inline:
            - ["<|", "|>"]
      typographer:
        leftAngleQuote: "《"
        rightAngleQuote: "》"
  highlight:
    noClasses: false
  tableOfContents:
    endLevel: 4
    ordered: true
    startLevel: 2

pagination:
  pagerSize: 6

params:
  # Hextra 는 섹션 트리를, Stack 은 이 목록을 글 모음으로 본다
  mainSections:
    - review
    - analysis
  rssFullContent: true
  favicon: /favicon.ico

  footer:
    since: 2023

  dateFormat:
    published: "2006-01-02"
    lastUpdated: "2006-01-02"

  sidebar:
    compact: false
    subtitle: "게임을 읽는 여러 가지 방법"
    avatar: img/avatar.png

  article:
    math: false
    toc: true
    # 글자 수로 계산한 예상 읽기 시간. 분석 글에서는 "20분 정도"가
    # 편집 일정처럼 읽혀 오해를 주므로 끈다.
    readingTime: false
    license:
      enabled: false

  # 홈은 우측 사이드바를 비움. 위젯 목록이 비면 <aside> 자체가 렌더되지 않아
  # 2단 레이아웃이 된다. 검색은 좌측 사이드바 하단으로 옮김
  # (layouts/_partials/sidebar/left.html 오버라이드).
  #
  # 글 페이지에는 목차 위젯만 둔다 (2026-10-14). 테마가 그리는 오른쪽 열과 접이식 목차 상자는
  # custom.scss 에서 숨기고(배치가 홈과 같아야 해서), 목차는 오른쪽 아래 "목차" 버튼으로 연다.
  # 1000px 이상은 오른쪽 패널, 휴대폰은 하단 시트 (assets/js/toc-sheet.js). 위젯은 목차 내용을 그리려고 켜 둔다.
  widgets:
    homepage: []
    page:
      - type: toc

  colorScheme:
    toggle: true
    default: auto

  imageProcessing:
    content:
      enabled: true
    thumbnail:
      enabled: true

  comments:
    enabled: false

  # 방문 통계. 대시보드: https://cstrnull00.goatcounter.com
  # Stack 은 GoatCounter 를 기본 지원하지 않아
  # layouts/_partials/head/custom.html 에서 직접 삽입한다.
  analytics:
    goatCounter:
      code: cstrnull00

menu:
  main:
    - identifier: home
      name: 홈
      url: /
      weight: 1
      params:
        icon: home
        newTab: false
    - identifier: review
      name: 게임 리뷰
      url: /review/
      weight: 2
      params:
        icon: device-gamepad-2
    - identifier: analysis
      name: 탐구와 분석
      url: /analysis/
      weight: 3
      params:
        icon: report-analytics

  social:
    - identifier: github
      name: GitHub
      url: https://github.com/cstrnull00
      params:
        icon: brand-github
    # 이 주소는 이미 커밋 작성자 정보로 공개되어 있다(51개 커밋).
    # 링크로 두는 것이 새 노출은 아니지만, 렌더된 페이지에 있으면
    # 스팸 수집기에는 더 잘 걸린다.
    - identifier: email
      name: Email
      url: mailto:thack9849@gmail.com
      params:
        icon: mail
