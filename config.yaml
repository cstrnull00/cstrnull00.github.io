baseURL: https://cstrnull00.github.io/
title: 기타 의견 반려함
theme: stack

locale: "ko-kr"
defaultContentLanguage: "ko"
# CJK 언어일 때 .Summary / .WordCount 가 올바르게 동작하도록
hasCJKLanguage: true
timeZone: "Asia/Seoul"

enableGitInfo: true

# robots.txt 를 생성한다. 내용은 layouts/robots.txt 에서 정의하며,
# 사이트맵 위치를 명시해 크롤러가 유입 링크 없이도 전체 페이지를 찾게 한다.
enableRobotsTXT: true

ignoreFiles:
  - ".*glossary.*"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
  tableOfContents:
    endLevel: 4
    ordered: true
    startLevel: 2

pagination:
  pagerSize: 6

params:
  # Hextra 는 섹션 트리를, Stack 은 이 목록을 글 모음으로 본다
  mainSections:
    - review
    - analysis
  rssFullContent: true
  favicon: /favicon.ico

  footer:
    since: 2023

  dateFormat:
    published: "2006-01-02"
    lastUpdated: "2006-01-02"

  sidebar:
    compact: false
    subtitle: "게임 시스템 기획자의 리뷰와 콘텐츠 분석"
    avatar: img/avatar.png

  article:
    math: false
    toc: true
    # 글자 수로 계산한 예상 읽기 시간. 분석 글에서는 "20분 정도"가
    # 편집 일정처럼 읽혀 오해를 주므로 끈다.
    readingTime: false
    license:
      enabled: false

  # 우측 사이드바를 비움. 위젯 목록이 비면 <aside> 자체가 렌더되지 않아
  # 2단 레이아웃이 된다. 검색은 좌측 사이드바 하단으로 옮김
  # (layouts/_partials/sidebar/left.html 오버라이드).
  widgets:
    homepage: []
    page: []

  colorScheme:
    toggle: true
    default: auto

  imageProcessing:
    content:
      enabled: true
    thumbnail:
      enabled: true

  comments:
    enabled: false

  # 방문 통계. 대시보드: https://cstrnull00.goatcounter.com
  # Stack 은 GoatCounter 를 기본 지원하지 않아
  # layouts/_partials/head/custom.html 에서 직접 삽입한다.
  analytics:
    goatCounter:
      code: cstrnull00

menu:
  main:
    - identifier: home
      name: 홈
      url: /
      weight: 1
      params:
        icon: home
        newTab: false
    - identifier: review
      name: 게임 리뷰
      url: /review/
      weight: 2
      params:
        icon: categories
    - identifier: analysis
      name: 콘텐츠 분석
      url: /analysis/
      weight: 3
      params:
        # 두 섹션은 같은 성격이므로 동일 아이콘
        icon: categories

  social:
    - identifier: github
      name: GitHub
      url: https://github.com/cstrnull00
      params:
        icon: brand-github
